name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build for ${{ matrix.os }}
    # This matrix tells GitHub to run the job 3 times using the details below
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: gui
            asset_name: chess-linux
            archive_name: chess-linux.tar.gz
          - os: macos-latest
            artifact_name: gui
            asset_name: chess-macos
            archive_name: chess-macos.zip
          - os: windows-latest
            artifact_name: gui.exe
            asset_name: chess-windows.exe
            archive_name: chess-windows.zip

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the project
        run: cargo build -p gui --release

      - name: Rename and Package Binary
        # We force bash so the script works uniformly across Linux, macOS, and Windows
        shell: bash
        run: |
          # Move into the release directory so the archive doesn't include the 'target/release' folder path
          cd target/release
          
          # Rename the binary
          mv ${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          
          # Package as .tar.gz for Linux, or .zip for Windows/macOS
          if [[ "${{ matrix.archive_name }}" == *.tar.gz ]]; then
            tar -czvf ${{ matrix.archive_name }} ${{ matrix.asset_name }}
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Use 7z for Windows since 'zip' is not available in Git Bash
            7z a ${{ matrix.archive_name }} ${{ matrix.asset_name }}
          else
            zip ${{ matrix.archive_name }} ${{ matrix.asset_name }}
          fi

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
