name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build for ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: gui
            bundle_dir: target/release/bundle/deb
            archive_name: chess-linux.tar.gz
            # Tar preserves unix file permissions (chmod +x)
            pack_cmd: tar -czf chess-linux.tar.gz -C dist .

          - os: macos-latest
            binary_name: gui
            bundle_dir: target/release/bundle/osx
            archive_name: chess-macos.zip
            # Info-ZIP preserves unix permissions inside the archive
            pack_cmd: cd dist && zip -r ../chess-macos.zip .

          - os: windows-latest
            binary_name: gui.exe
            bundle_dir: target/release/bundle/msi
            archive_name: chess-windows.zip
            pack_cmd: powershell Compress-Archive -Path dist\* -DestinationPath chess-windows.zip

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build Binary and Bundle
        run: |
          cargo build --release
          cargo bundle -p gui --release

      - name: Stage Artifacts for Compression
        shell: bash
        run: |
          mkdir -p dist
          # Copy the raw compiled binary
          cp target/release/${{ matrix.binary_name }} dist/
          # Copy the bundle output (.deb, .app directory, or .msi)
          cp -r ${{ matrix.bundle_dir }}/* dist/

      - name: Create Combined Archive
        run: ${{ matrix.pack_cmd }}

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
